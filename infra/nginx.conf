# This file belongs in nginx's http context (for example /etc/nginx/conf.d/),
# because the map below cannot appear inside a server block.

# Real-time notifications use a WebSocket at /api/notifications/socket. The
# upgrade only succeeds if these two hop-by-hop headers are forwarded, and
# sending "Connection: upgrade" on ordinary requests breaks keepalive — so the
# value is derived per request instead of hard-coded.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name git.kuklabs.com;

  client_max_body_size 2g;

  location / {
    proxy_pass http://kukgit:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_request_buffering off;
    proxy_buffering off;
    # Covers both long-lived Git transfers and idle WebSocket connections. Keep
    # this above KUKGIT_REALTIME_HEARTBEAT_MS so an idle socket is not cut off.
    proxy_read_timeout 3600s;
  }
}
