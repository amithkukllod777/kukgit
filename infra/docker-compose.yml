services:
  kukgit:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      KUKGIT_BASE_URL: ${KUKGIT_BASE_URL:-http://localhost:8787}
      KUKGIT_COOKIE_SECURE: ${KUKGIT_COOKIE_SECURE:-true}

      # Identity. NODE_ENV=production still defaults to authkit, and the three
      # AUTHKIT values are required in that mode. Set KUKGIT_AUTH_MODE=local to
      # run on KukGit's own accounts instead — that needs an https base URL, a
      # Secure cookie, and one of the mail senders below.
      KUKGIT_AUTH_MODE: ${KUKGIT_AUTH_MODE:-authkit}
      KUKGIT_AUTHKIT_BASE_URL: ${KUKGIT_AUTHKIT_BASE_URL:-}
      KUKGIT_AUTHKIT_PRODUCT_ID: ${KUKGIT_AUTHKIT_PRODUCT_ID:-kukgit}
      KUKGIT_AUTHKIT_ENCRYPTION_KEY: ${KUKGIT_AUTHKIT_ENCRYPTION_KEY:-}

      # Phone verification. All three are public values, not secrets.
      KUKGIT_FIREBASE_PROJECT_ID: ${KUKGIT_FIREBASE_PROJECT_ID:-}
      KUKGIT_FIREBASE_API_KEY: ${KUKGIT_FIREBASE_API_KEY:-}
      KUKGIT_FIREBASE_AUTH_DOMAIN: ${KUKGIT_FIREBASE_AUTH_DOMAIN:-}

      # Instance operator allowlist. Falls back to KUKGIT_ADMIN_EMAIL when unset.
      KUKGIT_INSTANCE_ADMIN_EMAILS: ${KUKGIT_INSTANCE_ADMIN_EMAILS:-}
      KUKGIT_ADMIN_EMAIL: ${KUKGIT_ADMIN_EMAIL:-}
      KUKGIT_ADMIN_NAME: ${KUKGIT_ADMIN_NAME:-KukGit Administrator}
      # Only used when KUKGIT_AUTH_MODE=local.
      KUKGIT_ADMIN_PASSWORD: ${KUKGIT_ADMIN_PASSWORD:-}

      # Feature keys. Each feature stays unavailable until its key is set.
      KUKGIT_WEBHOOK_ENCRYPTION_KEY: ${KUKGIT_WEBHOOK_ENCRYPTION_KEY:-}
      KUKGIT_LFS_AUTH_KEY: ${KUKGIT_LFS_AUTH_KEY:-}

      # Transactional email. Invitations and notifications stay queued without it.
      KUKGIT_SMTP_HOST: ${KUKGIT_SMTP_HOST:-}
      KUKGIT_SMTP_PORT: ${KUKGIT_SMTP_PORT:-587}
      KUKGIT_SMTP_SECURE: ${KUKGIT_SMTP_SECURE:-false}
      KUKGIT_SMTP_STARTTLS: ${KUKGIT_SMTP_STARTTLS:-true}
      KUKGIT_SMTP_USER: ${KUKGIT_SMTP_USER:-}
      KUKGIT_SMTP_PASSWORD: ${KUKGIT_SMTP_PASSWORD:-}
      KUKGIT_EMAIL_FROM: ${KUKGIT_EMAIL_FROM:-}
      KUKGIT_EMAIL_FROM_NAME: ${KUKGIT_EMAIL_FROM_NAME:-KukGit}

      # Provider bounce/complaint callbacks. Off unless both are set.
      KUKGIT_EMAIL_PROVIDER_EVENTS_ENABLED: ${KUKGIT_EMAIL_PROVIDER_EVENTS_ENABLED:-false}
      KUKGIT_EMAIL_PROVIDER_WEBHOOK_SECRET: ${KUKGIT_EMAIL_PROVIDER_WEBHOOK_SECRET:-}

      # SSH clone URLs shown in the web interface.
      KUKGIT_SSH_HOST: ${KUKGIT_SSH_HOST:-}
      KUKGIT_SSH_PORT: ${KUKGIT_SSH_PORT:-22}
      KUKGIT_SSH_USER: ${KUKGIT_SSH_USER:-git}
    ports:
      - "8787:8787"
    volumes:
      - kukgit_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  kukgit_data:
