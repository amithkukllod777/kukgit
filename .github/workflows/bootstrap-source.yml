name: Publish KukGit Foundation MVP

on:
  pull_request:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .bootstrap/source.part01 .bootstrap/source.part02 .bootstrap/source.part03 .bootstrap/source.part04
            cat .bootstrap/fix05/chunk00 .bootstrap/fix05/chunk01 .bootstrap/fix05v2/chunk02 .bootstrap/fix05v2/chunk03 .bootstrap/fix05/chunk04_05 .bootstrap/fix05/chunk06_07
            cat .bootstrap/source.part06 .bootstrap/source.part07
            cat .bootstrap/fix08/chunk00_01 .bootstrap/fix08/chunk02_03 .bootstrap/fix08/chunk04_05 .bootstrap/fix08/chunk06_07
            cat .bootstrap/source.part09 .bootstrap/source.part10 .bootstrap/source.part11 .bootstrap/source.part12 .bootstrap/source.part13
          } | base64 --decode > /tmp/kukgit-source.tar.gz
          echo "ac2006b7a1f96e2a2ee765d086cde7fb9919fcdd7dd6af4072ed3f8cdf3fbb82  /tmp/kukgit-source.tar.gz" | sha256sum -c -
          gzip -t /tmp/kukgit-source.tar.gz

      - name: Replace bootstrap files with KukGit source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kukgit-source
          tar -xzf /tmp/kukgit-source.tar.gz -C /tmp/kukgit-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/kukgit-source/. .

      - name: Commit and publish KukGit Foundation MVP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kuklabs Build Bot"
          git config user.email "buildbot@kuklabs.com"
          git add -A
          git commit -m "feat: publish KukGit v0.1.0 Foundation MVP"
          git push origin HEAD:main
