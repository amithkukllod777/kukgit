name: KukGit CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run captured validation pipeline
        shell: bash
        run: |
          set +e
          : > stage7-normal-output.txt
          status=0
          run_step() {
            echo "\n===== $1 =====" | tee -a stage7-normal-output.txt
            shift
            "$@" 2>&1 | tee -a stage7-normal-output.txt
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then status="$code"; fi
          }
          run_step "git version" git --version
          run_step "npm ci" npm ci --ignore-scripts
          run_step "pg package" node -e "import('pg').then((module) => { if (typeof (module.Client || module.default?.Client) !== 'function') process.exit(1) })"
          run_step "doctor" npm run doctor
          run_step "syntax" npm run check
          run_step "tests" npm test
          exit "$status"
      - name: Upload normal-suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-normal-test-output
          path: stage7-normal-output.txt
          retention-days: 1

  postgresql-write-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kukgit
          POSTGRES_PASSWORD: kukgit-ci-password
          POSTGRES_DB: kukgit_stage7
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kukgit -d kukgit_stage7"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      KUKGIT_TEST_POSTGRES_URL: postgresql://kukgit:kukgit-ci-password@127.0.0.1:5432/kukgit_stage7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run captured PostgreSQL pipeline
        shell: bash
        run: |
          set +e
          : > stage7-postgresql-output.txt
          status=0
          run_step() {
            echo "\n===== $1 =====" | tee -a stage7-postgresql-output.txt
            shift
            "$@" 2>&1 | tee -a stage7-postgresql-output.txt
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then status="$code"; fi
          }
          run_step "npm ci" npm ci --ignore-scripts
          run_step "PostgreSQL write compatibility" node --test --test-reporter=spec test/runtime-write-postgresql.test.mjs
          exit "$status"
      - name: Upload PostgreSQL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-postgresql-test-output
          path: stage7-postgresql-output.txt
          retention-days: 1
