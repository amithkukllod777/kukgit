name: KukGit CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git --version
      - run: npm ci --ignore-scripts
      - name: Validate node-postgres package
        run: node -e "import('pg').then((module) => { if (typeof (module.Client || module.default?.Client) !== 'function') process.exit(1) })"
      - run: npm run doctor
      - run: npm run check
      - name: Run tests with diagnostics
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Upload temporary Stage 5 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-test-output-${{ github.run_id }}
          path: test-output.log
          retention-days: 1
