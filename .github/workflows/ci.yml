name: KukGit CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git --version
      - run: npm ci --ignore-scripts
      - name: Validate node-postgres package
        run: node -e "import('pg').then((module) => { if (typeof (module.Client || module.default?.Client) !== 'function') process.exit(1) })"
      - run: npm run doctor
      - run: npm run check
      - run: npm test

  postgresql-write-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kukgit
          POSTGRES_PASSWORD: kukgit-ci-password
          POSTGRES_DB: kukgit_stage7
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kukgit -d kukgit_stage7"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      KUKGIT_TEST_POSTGRES_URL: postgresql://kukgit:kukgit-ci-password@127.0.0.1:5432/kukgit_stage7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run PostgreSQL write compatibility suite
        run: node --test --test-reporter=spec test/runtime-write-postgresql.test.mjs
