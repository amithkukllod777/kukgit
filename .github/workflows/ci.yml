name: KukGit CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git --version
      - run: npm ci --ignore-scripts
      - name: Validate node-postgres package
        run: node -e "import('pg').then((module) => { if (typeof (module.Client || module.default?.Client) !== 'function') process.exit(1) })"
      - run: npm run doctor
      - run: npm run check
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee authkit-hardening-test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authkit-hardening-test-output
          path: authkit-hardening-test-output.txt
          retention-days: 1
