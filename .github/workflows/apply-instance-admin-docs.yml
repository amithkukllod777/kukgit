name: Apply Instance Admin Documentation

on:
  push:
    branches: [feature/instance-admin-console]

permissions:
  contents: write

jobs:
  patch-docs:
    if: ${{ !contains(github.event.head_commit.message, 'docs: publish instance admin console') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instance-admin-console
          fetch-depth: 0
      - name: Patch README and roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          feature_marker = '- Responsive Kuklabs-branded web interface\n'
          feature_block = '''- Secure Kuklabs instance-admin console with independent operator allowlist\n- Tenant-scoped user, organization, repository, delivery, storage and audit diagnostics\n- Redacted support notes plus confirmed failed-email and webhook retry controls\n'''
          if feature_block not in text:
              text = text.replace(feature_marker, feature_marker + feature_block)
          text = text.replace(', broader administration and high-availability deployment.', ' and high-availability deployment.')
          section = '''## Instance administration\n\nConfigure `KUKGIT_INSTANCE_ADMIN_EMAILS` with a minimal comma-separated allowlist of verified One Kuklabs Account operators. Authorized operators receive a separate **Instance Admin** navigation entry with adoption metrics, bounded cross-tenant search, tenant and user diagnostics, redacted audit lookup, support notes, and confirmed retry controls for terminal email and webhook failures.\n\nInstance authority is independent from organization roles. The console never exposes passwords, OTPs, AuthKit tokens, PAT material, webhook secrets or SSH private keys, and it does not support impersonation. Read [Instance Admin Console](docs/INSTANCE_ADMIN_CONSOLE.md) before enabling production support access.\n\n'''
          if '## Instance administration\n' not in text:
              text = text.replace('## Commands\n', section + '## Commands\n')
          readme.write_text(text)

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          delivered = '''- independent instance-administrator email allowlist\n- read-only-by-default instance operations console\n- adoption, repository, external-access, delivery, LFS, backup and audit metrics\n- bounded cross-tenant user, organization and repository search\n- tenant-scoped member, repository, storage, external-access and delivery diagnostics\n- credential-free user identity, membership and security-count diagnostics\n- recursive server-side audit metadata redaction\n- request ID, action, target and organization audit lookup\n- confirmed tenant support notes with audit events\n- confirmed failed/cancelled email retry and terminal webhook retry\n- responsive Admin navigation, overview, search, tenant, user and audit interfaces\n- no-impersonation and no-credential-exposure support boundary\n- instance-admin privacy, isolation, CSRF, confirmation and retry tests\n- instance administration and tenant support operations runbook\n'''
          if delivered not in text:
              text = text.replace('\nRemaining:\n', '\n' + delivered + '\nRemaining:\n')
          text = text.replace('- broader admin console and tenant support tools\n', '')
          roadmap.write_text(text)
          PY
          if git diff --quiet; then
            echo "Documentation already patched."
            exit 0
          fi
          git config user.name "KukGit CI"
          git config user.email "actions@users.noreply.github.com"
          git add README.md docs/ROADMAP.md
          git commit -m "docs: publish instance admin console"
          git push origin HEAD:feature/instance-admin-console
